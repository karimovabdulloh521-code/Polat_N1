<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Xarajatlar — Ziyo Famliy admin</title>
<link rel="stylesheet" href="../style.css?v=202610281339">
<link rel="stylesheet" href="theme.css?v=202610281339">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body>
  <div class="admin-page">

    <header class="page-head">
      <div class="page-head-left">
        <a href="index.html" class="icon-btn page-head-mobile-only" id="backBtn" aria-label="Ortga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="brand-mark page-head-mobile-only" aria-hidden="true">P</div>
        <div class="page-head-text">
          <p class="page-date" id="pageDate">&nbsp;</p>
          <h1 class="page-title">Xarajatlar</h1>
        </div>
      </div>
      <button class="icon-btn page-head-mobile-only" id="logoutBtn" type="button" aria-label="Chiqish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <main class="page-main">
      <div class="card">
        <div class="form-grid">
          <div class="field"><label>Sana</label><input id="fDate" type="date"></div>
          <div class="field"><label>Summasi (so'm)</label><input id="fAmount" type="number"></div>
          <div class="field"><label>Turkumi (ixtiyoriy)</label><input id="fCategory" placeholder="masalan: mahsulot, kommunal"></div>
          <div class="field"><label>Izoh</label><input id="fNote"></div>
          <button class="btn primary block" id="addBtn">+ Xarajat qo'shish</button>
        </div>
      </div>

      <div class="card">
        <div class="form-grid" style="flex-direction:row; gap:8px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field"><label>Dan</label><input id="filterFrom" type="date"></div>
          <div class="field"><label>Gacha</label><input id="filterTo" type="date"></div>
          <button class="btn" id="filterBtn">Filtrlash</button>
        </div>
      </div>

      <div id="expenseList" class="data-list as-table"><p class="dim">Yuklanmoqda...</p></div>
    </main>

  </div>

  <script src="../app.js?v=202610281339" data-api-base="../"></script>
  <script src="../app-print.js?v=202610281339"></script>
  <script src="../app-notify.js?v=202610281339"></script>
  <script src="layout.js?v=202610281339"></script>
  <script src="expenses.js?v=202610281339"></script>
</body>
</html>
