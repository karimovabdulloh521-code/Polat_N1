<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Xodimlar — Ziyo Famliy admin</title>
<link rel="stylesheet" href="../style.css?v=202610281339">
<link rel="stylesheet" href="theme.css?v=202610281339">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body>
  <div class="admin-page">

    <header class="page-head">
      <div class="page-head-left">
        <a href="index.html" class="icon-btn page-head-mobile-only" id="backBtn" aria-label="Ortga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="brand-mark page-head-mobile-only" aria-hidden="true">P</div>
        <div class="page-head-text">
          <p class="page-date" id="pageDate">&nbsp;</p>
          <h1 class="page-title">Xodimlar</h1>
        </div>
      </div>
      <button class="icon-btn page-head-mobile-only" id="logoutBtn" type="button" aria-label="Chiqish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
      </button>
      <div class="page-head-actions">
        <button class="btn primary block" id="addBtn">+ Yangi foydalanuvchi</button>
      </div>
    </header>

    <main class="page-main">
      <div id="userList" class="data-list as-table"><p class="helper-text">Yuklanmoqda...</p></div>
    </main>

  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Yangi foydalanuvchi</h2>
      <div class="form-grid">
        <div class="field"><label>Login</label><input id="fUsername"></div>
        <div class="field" id="passField"><label>Parol</label><input id="fPassword" type="text"></div>
        <div class="field"><label>To'liq ismi</label><input id="fFullName"></div>
        <div class="field">
          <label>Rol</label>
          <select id="fRole">
            <option value="waiter">Afitsiant</option>
            <option value="chef">Oshpaz</option>
            <option value="courier">Dastavka</option>
            <option value="kassir">Kassir</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelBtn">Bekor</button>
        <button class="btn primary" id="saveBtn">Saqlash</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="resetModal">
    <div class="modal">
      <h2>Parolni tiklash</h2>
      <div class="form-grid">
        <div class="field"><label>Yangi parol</label><input id="rPassword" type="text"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="resetCancelBtn">Bekor</button>
        <button class="btn primary" id="resetSaveBtn">Saqlash</button>
      </div>
    </div>
  </div>

  <script src="../app.js?v=202610281339" data-api-base="../"></script>
  <script src="../app-print.js?v=202610281339"></script>
  <script src="../app-notify.js?v=202610281339"></script>
  <script src="layout.js?v=202610281339"></script>
  <script src="waiters.js?v=202610281339"></script>
</body>
</html>
