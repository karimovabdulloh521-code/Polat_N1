<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hisobot — Ziyo Famliy admin</title>
<link rel="stylesheet" href="../style.css?v=202610281339">
<link rel="stylesheet" href="theme.css?v=202610281339">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body>
  <div class="admin-page">

    <header class="page-head">
      <div class="page-head-left">
        <a href="index.html" class="icon-btn page-head-mobile-only" id="backBtn" aria-label="Ortga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="brand-mark page-head-mobile-only" aria-hidden="true">P</div>
        <div class="page-head-text">
          <p class="page-date" id="pageDate">&nbsp;</p>
          <h1 class="page-title">Hisobot</h1>
        </div>
      </div>
      <button class="icon-btn page-head-mobile-only" id="logoutBtn" type="button" aria-label="Chiqish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <main class="page-main">
      <div class="card">
        <div class="form-grid" style="flex-direction:row; gap:8px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field"><label>Dan</label><input id="filterFrom" type="date"></div>
          <div class="field"><label>Gacha</label><input id="filterTo" type="date"></div>
          <button class="btn primary" id="filterBtn">Ko'rsatish</button>
        </div>
      </div>

      <div class="stat-row cols-2">
        <div class="stat-card"><span class="stat-label">Tushum</span><span class="stat-value" id="statRevenue">—</span></div>
        <div class="stat-card"><span class="stat-label">Xarajat</span><span class="stat-value" id="statExpenses">—</span></div>
        <div class="stat-card"><span class="stat-label">Sof foyda</span><span class="stat-value profit" id="statNet">—</span></div>
        <div class="stat-card"><span class="stat-label">Yopilgan buyurtma</span><span class="stat-value" id="statOrders">—</span></div>
      </div>

      <!-- 2026-10-24: tushumning qancha qismi hali to'lanmagani (kassaga yuborilgan, to'lov turi kiritilmagan) -->
      <div class="unpaid-alert hidden mt-16" id="reportUnpaid" role="status"></div>

      <!-- 2026-10-28: qo'lda chekning tan narxi hisoblanmasligi haqida ogohlantirish -->
      <div class="hidden mt-8" id="reportManualCogsNote"></div>

      <div class="page-section-head mt-16"><h2 class="page-section-title">Yopilgan buyurtmalar</h2></div>
      <div id="orderList" class="data-list as-table mt-8"><p class="dim">Yuklanmoqda...</p></div>
    </main>

  </div>

  <script src="../app.js?v=202610281339" data-api-base="../"></script>
  <script src="../app-print.js?v=202610281339"></script>
  <script src="../app-notify.js?v=202610281339"></script>
  <script src="layout.js?v=202610281339"></script>
  <script src="reports.js?v=202610281339"></script>
</body>
</html>
