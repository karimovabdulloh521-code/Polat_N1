<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hisoblash — Kassa — Ziyo Famliy</title>
<link rel="stylesheet" href="../style.css?v=202610281339">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav">
      <a href="tables.html" data-page="tables"><span class="ic">🪑</span>Stollar</a>
      <a href="customer-orders.html" data-page="customer-orders"><span class="ic">🧾</span>Buyurtmalar</a>
      <a href="stats.html" data-page="stats"><span class="ic">📈</span>Statistika</a>
      <a href="manual.html" data-page="manual"><span class="ic">🧮</span>Hisoblash</a>
    </nav>
    <div style="flex:1;">
      <div class="topbar">
        <h1>Qo'lda hisoblash</h1>
        <button class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <div class="card">
          <div class="card-title mt-8">Taomlar</div>
          <div id="itemRows"></div>
          <div class="form-grid" style="flex-direction:row; gap:8px;">
            <button class="btn mt-8" type="button" id="menuBtn" style="flex:1;">📋 Menyu</button>
            <button class="btn mt-8" type="button" id="addRowBtn" style="flex:1;">+ Qator qo'shish</button>
          </div>
        </div>
      </main>

      <div class="order-total-bar with-phone">
        <input type="tel" id="customerPhoneInput" class="phone-input" placeholder="📞 Mijoz raqami (ixtiyoriy)" inputmode="tel" maxlength="30">
        <input type="text" id="billNoteInput" class="phone-input" placeholder="📍 Manzil (ixtiyoriy)" maxlength="300">
        <input type="text" id="billReasonInput" class="phone-input" placeholder="📝 Nega qo'lda yozildi? (ixtiyoriy)" maxlength="300">
        <label class="phone-input delivery-price-field">
          <input type="checkbox" id="deliveryPriceEnabled">
          <span>🚚 Yetkazib berish</span>
          <input type="number" id="deliveryPriceInput" min="0" step="500" inputmode="numeric" value="5000" disabled>
        </label>
        <span>Jami: <span class="amount" id="totalAmount">0 so'm</span></span>
        <button class="btn" id="clearBtn" style="background:#fff;color:#c0392b;">Tozalash</button>
        <button class="btn" id="createBtn" style="background:#fff;color:var(--primary);">💳 Chek chiqarish</button>
      </div>
    </div>
  </div>
  <script src="../app.js?v=202610281339" data-api-base="../"></script>
  <script src="../app-print.js?v=202610281339"></script>
  <script src="../app-notify.js?v=202610281339"></script>
  <script src="../menu-picker.js?v=202610281339"></script>
  <script src="shift-ui.js?v=202610281339"></script>
  <script src="manual.js?v=202610281339"></script>
</body>
</html>
