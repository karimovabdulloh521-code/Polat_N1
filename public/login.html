<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ziyo Famliy — kirish</title>
<link rel="stylesheet" href="style.css?v=202610281339">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-boot">
        <div class="login-mark">P</div>
        <p><strong>Ziyo Famliy</strong> restorani</p>
        <p class="dim">Tizimga kirish uchun login va parolingizni kiriting</p>
      </div>
      <div class="login-label">Login</div>
      <div class="input-field">
        <input type="text" id="username" autocomplete="username" required autofocus>
        <span class="input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>
        </span>
      </div>
      <div class="login-label">Parol</div>
      <div class="input-field">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Parolni ko'rsatish"></button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit">Kirish</button>
    </form>
  </div>
  <script src="app.js?v=202610281339"></script>
  <script src="login.js?v=202610281339"></script>
</body>
</html>
